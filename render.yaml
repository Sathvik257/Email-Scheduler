services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: WORKER_CONCURRENCY
        value: "5"

      - key: MIN_EMAIL_DELAY_MS
        value: "2000"

      - key: MAX_EMAILS_PER_HOUR
        value: "200"

      - key: ETHEREAL_ACCOUNTS_JSON
        sync: false

  - type: worker
    name: reachinbox-worker
    runtime: node
    rootDir: backend
    region: singapore
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run worker:start
    envVars:
      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString

      - key: JWT_SECRET
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: JWT_SECRET

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: WORKER_CONCURRENCY
        value: "5"

      - key: MIN_EMAIL_DELAY_MS
        value: "2000"

      - key: MAX_EMAILS_PER_HOUR
        value: "200"

      - key: ETHEREAL_ACCOUNTS_JSON
        sync: false

  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: reachinbox-redis
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: reachinbox-postgres
    region: singapore
    plan: basic-256mb
    ipAllowList: []